<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Barbershop ERP</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 40px;
      width: 380px;
      box-shadow: 0 2px 20px rgba(0,0,0,0.08);
    }
    h1 { font-size: 24px; margin-bottom: 8px; color: #111; }
    p.sub { color: #666; margin-bottom: 28px; font-size: 14px; }
    label { display: block; font-size: 14px; font-weight: 500; color: #333; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 15px;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }
    input:focus { outline: none; border-color: #111; }
    button {
      width: 100%;
      padding: 12px;
      background: #111;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .erro { color: #dc2626; font-size: 13px; margin-bottom: 12px; display: none; }
    .sucesso { color: #16a34a; font-size: 13px; margin-bottom: 12px; display: none; }
    .info { 
      margin-top: 20px; padding: 12px; background: #f0f0f0; border-radius: 6px;
      font-size: 13px; color: #555; line-height: 1.5;
    }
    .loading { display: none; text-align: center; color: #666; margin: 12px 0; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Barbershop ERP</h1>
    <p class="sub">Faça login para continuar</p>

    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="seu@email.com" value="admin@demo.com" required>

      <label for="password">Senha</label>
      <input type="password" id="password" placeholder="********" value="123456" required>

      <div class="erro" id="erro"></div>
      <div class="sucesso" id="sucesso"></div>
      <div class="loading" id="loading">Autenticando...</div>

      <button type="submit" id="btn">Entrar</button>
    </form>

    <div class="info">
      <strong>Teste:</strong> admin@demo.com / 123456
    </div>
  </div>

  <script>
    // Tenta detectar a URL da API automaticamente
    function getApiUrl() {
      // Se for localhost, usa a mesma origem
      const host = window.location.hostname;
      if (host === 'localhost' || host === '127.0.0.1') {
        // Backend local na porta 3001
        return 'http://localhost:3001';
      }
      // Na mesma rede, usa o IP da máquina
      return 'http://192.168.1.6:3001';
    }

    const API = getApiUrl();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const erro = document.getElementById('erro');
      const sucesso = document.getElementById('sucesso');
      const loading = document.getElementById('loading');
      const btn = document.getElementById('btn');

      erro.style.display = 'none';
      sucesso.style.display = 'none';
      loading.style.display = 'block';
      btn.disabled = true;

      try {
        const res = await fetch(API + '/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        if (!res.ok) {
          const text = await res.text();
          throw new Error(text || 'Erro ao autenticar');
        }

        const data = await res.json();

        // Salva token
        localStorage.setItem('barbershop_access_token', data.accessToken);
        localStorage.setItem('barbershop_refresh_token', data.refreshToken);

        sucesso.textContent = '✅ Login OK! Redirecionando...';
        sucesso.style.display = 'block';

        // Mostra dados do usuário
        setTimeout(() => {
          window.location.href = '/dashboard';
        }, 1000);

      } catch (err) {
        erro.textContent = '❌ ' + (err.message || 'Erro ao fazer login');
        erro.style.display = 'block';
      } finally {
        loading.style.display = 'none';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
