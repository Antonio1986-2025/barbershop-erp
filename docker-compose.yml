services:
  postgres:
    image: postgres:16-alpine
    container_name: barbershop-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: barbershop_erp_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: barbershop-backend
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/barbershop_erp_dev
      JWT_SECRET: ${JWT_SECRET:-docker-dev-secret-change-in-production}
      APP_VERSION: ${APP_VERSION:-1.0.0}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    container_name: barbershop-frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      - backend

  db-init:
    image: node:20-alpine
    container_name: barbershop-db-init
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/barbershop_erp_dev
    entrypoint: >
      sh -c "
        cd /app &&
        npm ci &&
        npx prisma generate &&
        npx prisma db push --accept-data-loss &&
        npx tsx prisma/seed.ts
      "
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
